server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same /api -> backend proxy the Vite dev server does locally (see vite.config.ts),
    # just pointed at the "backend" service name on the Docker network instead of localhost.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing — fall back to index.html for any unknown path.
    location / {
        try_files $uri /index.html;
    }
}
